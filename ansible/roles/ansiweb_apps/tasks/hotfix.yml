---
- name: "Fetch the update package for {{ item_def.kb }}"
  ansible.windows.win_get_url:
    url: "{{ item_def.url }}"
    dest: "{{ item_def.win_file }}"
    checksum: "{{ item_def.sha256 | lower }}"
    checksum_algorithm: sha256
    force: false

- name: "Install {{ item_def.kb }}"
  ansible.windows.win_hotfix:
    source: "{{ item_def.win_file }}"
    state: present
  register: aw_hotfix
  # Already installed, or superseded by a later update: both mean nothing to do
  failed_when:
    - aw_hotfix is failed
    - "'2359302' not in (aw_hotfix.msg | default(''))"
    - "'already installed' not in (aw_hotfix.msg | default('') | lower)"

- name: "Record the result for {{ item_def.kb }}"
  ansible.builtin.set_fact:
    aw_results: '{{ aw_results + [{"kind": "hotfix", "id": item_def.kb, "name": item_def.kb
                                   ~ (" - " ~ item_def.title if item_def.title else ""),
                                   "status": ("installed" if aw_hotfix.changed | default(false)
                                              else "already present"),
                                   "detail": (aw_hotfix.msg | default("")) | truncate(300, true)}] }}'

- name: "Note that {{ item_def.kb }} needs a reboot"
  ansible.builtin.set_fact:
    aw_reboot_needed: true
  when: aw_hotfix.reboot_required | default(false)

- name: "Tidy away the package for {{ item_def.kb }}"
  ansible.windows.win_file:
    path: "{{ item_def.win_file }}"
    state: absent
