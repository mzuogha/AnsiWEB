---
- name: Check whether Office is installed
  ansible.windows.win_stat:
    path: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
  register: aw_word

- name: Install Office from the AnsiWEB cache
  when: not aw_word.stat.exists
  vars:
    office: "{{ aw_plan.office }}"
    odir: 'C:\ProgramData\AnsiWEB\Office'
  block:
    - name: Create the Office download folder
      ansible.windows.win_file:
        path: "{{ odir }}"
        state: directory

    - name: Create Office sub-folders
      ansible.windows.win_file:
        path: "{{ odir }}\\{{ item }}"
        state: directory
      loop: "{{ office.dirs }}"

    - name: Download the Office Deployment Tool
      ansible.windows.win_get_url:
        url: "{{ office.setup_url }}"
        dest: "{{ odir }}\\setup.exe"
        force: true

    - name: Download Office files (several GB)
      ansible.windows.win_get_url:
        url: "{{ item.url }}"
        dest: "{{ odir }}\\{{ item.win_path }}"
        checksum: "{{ item.sha256 | lower }}"
        checksum_algorithm: sha256
        force: false
        url_timeout: 600
      loop: "{{ office.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Write the Office configuration
      ansible.windows.win_template:
        src: office-install.xml.j2
        dest: "{{ odir }}\\configuration.xml"
      no_log: true

    - name: Install Office (typically 10-30 minutes)
      ansible.windows.win_package:
        path: "{{ odir }}\\setup.exe"
        arguments: '/configure "{{ odir }}\configuration.xml"'
        creates_path: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
        state: present
      register: aw_office_install

    - name: Note that Office needs a reboot
      ansible.builtin.set_fact:
        aw_reboot_needed: true
      when: aw_office_install.reboot_required | default(false)

    - name: Remove the Office installation files
      ansible.windows.win_file:
        path: "{{ odir }}"
        state: absent

- name: Read which Office products are installed
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration
    name: ProductReleaseIds
  register: aw_c2r

- name: Point Office updates at the AnsiWEB server (only for the Office product AnsiWEB manages)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\office\16.0\common\officeupdate
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: "{{ item.type }}"
  loop:
    - { name: updatepath, data: "{{ aw_plan.office.update_url }}", type: string }
    - { name: enableautomaticupdates, data: 1, type: dword }
  when: aw_plan.office.product_id | lower in (aw_c2r.value | default('') | lower)
