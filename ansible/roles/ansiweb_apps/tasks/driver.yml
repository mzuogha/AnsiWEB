---
- name: Fetch the driver package
  ansible.builtin.include_tasks: payload_get.yml

- name: "Install driver {{ item_def.name }}"
  when: aw_run | bool
  block:
    - name: "Unpack {{ item_def.name }}"
      community.windows.win_unzip:
        src: "{{ item_def.win_file }}"
        dest: "{{ item_def.win_unpack }}"
        delete_archive: false

    - name: "Add {{ item_def.name }} to the Windows driver store"
      ansible.windows.win_powershell:
        parameters:
          Folder: "{{ item_def.win_unpack }}"
        script: "{{ lookup('ansible.builtin.file', 'install_driver.ps1') }}"
      register: aw_driver

    - name: "Record the result for {{ item_def.name }}"
      ansible.builtin.set_fact:
        aw_results: '{{ aw_results + [{"kind": "drivers", "id": item_def.id, "name": item_def.name,
                                       "status": "installed", "detail": aw_driver.result.detail}] }}'

    - name: "Note that {{ item_def.name }} asked for a reboot"
      ansible.builtin.set_fact:
        aw_reboot_needed: true
      when: aw_driver.result.reboot | default(false)

    - name: "Remove the unpacked {{ item_def.name }}"
      ansible.windows.win_file:
        path: "{{ item_def.win_unpack }}"
        state: absent

- name: "Record that {{ item_def.name }} was already installed"
  ansible.builtin.set_fact:
    aw_results: '{{ aw_results + [{"kind": "drivers", "id": item_def.id, "name": item_def.name,
                                   "status": "already installed", "detail": ""}] }}'
  when: not (aw_run | bool)

- name: Record the driver state
  ansible.builtin.include_tasks: payload_done.yml
