# Initial AnsiWEB configuration. Copied to $ANSIWEB_DATA/config.yml on first start,
# then managed from the web interface.
settings:
  server_ip: ""            # control node IP address that PCs use to reach AnsiWEB
  pc_account: Admin        # local administrator account on the PCs used by AnsiWEB
  allow_reboot: false      # reboot PCs automatically when an installer asks for it
  forks: 20                # how many PCs Ansible works on at the same time
  batch_size: 20           # PCs per batch during a deployment
  log_retention_days: 60   # how long job logs are kept

# Windows activation. The product key itself is stored encrypted, not here.
activation:
  enabled: false
  mode: mak               # mak = a key you own, kms = a KMS host on your network
  kms_host: ""            # e.g. kms.example.local (KMS mode only)
  kms_port: 1688
  skip_if_activated: true # leave PCs alone that Windows already reports as activated
  targets: [all]

schedules:
  cache_check:
    enabled: true
    every_hours: 24        # check vendors for new versions and refresh the cache
  deploy:
    enabled: false
    time: "19:00"          # push missing apps and updates to all PCs
    days: [mon, tue, wed, thu, fri]

sites: [HQ]
# {name, ip, site, groups: [], sync_hostname: false, notes: ""}
pcs: []

# Uploaded payloads: device drivers, scripts and registry files.
# Each entry: {id, name, enabled, file, sha256, size, uploaded, targets, ...}
drivers: []
scripts: []
registry: []

apps:
  - id: vcredist-x64
    name: Microsoft Visual C++ 2015-2022 Redistributable (x64)
    enabled: true
    source: winget
    winget_id: Microsoft.VCRedist.2015+.x64
    installer_types: [burn, exe]
    arguments: /install /quiet /norestart
    detect_pattern: '^Microsoft Visual C\+\+ .*Redistributable \(x64\)'
    pinned: false
    targets: [all]

  - id: 7zip
    name: 7-Zip
    enabled: true
    source: winget
    winget_id: 7zip.7zip
    installer_types: [exe]
    arguments: /S
    detect_pattern: '^7-Zip'
    pinned: false
    targets: [all]

  - id: adobe-reader
    name: Adobe Acrobat Reader (64-bit)
    enabled: true
    source: winget
    winget_id: Adobe.Acrobat.Reader.64-bit
    installer_types: [exe]
    arguments: -sfx_nu /sAll /rs /msi EULA_ACCEPT=YES
    detect_pattern: '^Adobe Acrobat'
    pinned: false
    targets: [all]

  - id: chrome
    name: Google Chrome
    enabled: true
    source: winget
    winget_id: Google.Chrome
    installer_types: [wix, msi]
    arguments: ""
    detect_pattern: '^Google Chrome$'
    pinned: false
    targets: [all]

  - id: firefox
    name: Mozilla Firefox 65 (pinned)
    enabled: true
    source: url
    url: https://download-installer.cdn.mozilla.net/pub/firefox/releases/65.0.2/win64/en-US/Firefox%20Setup%2065.0.2.msi
    version: 65.0.2
    sha256: ""
    arguments: ""
    detect_pattern: '^Mozilla Firefox'
    pinned: true
    firefox_disable_updates: true
    targets: [all]

  - id: java8
    name: Java 8 Runtime (Oracle, 64-bit)
    enabled: true
    source: winget
    winget_id: Oracle.JavaRuntimeEnvironment
    installer_types: [exe]
    arguments: /s REBOOT=0 SPONSORS=0 AUTO_UPDATE=0 REMOVEOUTOFDATEJRES=1
    detect_pattern: '^Java 8 Update \d+ \(64-bit\)'
    pinned: false
    targets: [all]

  - id: vlc
    name: VLC media player
    enabled: true
    source: winget
    winget_id: VideoLAN.VLC
    installer_types: [nullsoft, exe]
    arguments: /L=1033 /S
    detect_pattern: '^VLC media player'
    pinned: false
    targets: [all]

