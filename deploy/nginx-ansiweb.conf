# AnsiWEB: HTTPS dashboard, plus the installer cache over plain HTTP for the PCs.

# --- port 80: cache for the PCs, everything else redirected to HTTPS ---------
# Do not advertise the nginx version
server_tokens off;

server {
    listen 80 default_server;
    # IPv6 is not enabled by default: PCs reach AnsiWEB over IPv4.
    # Add "listen [::]:80 default_server;" if your network uses IPv6.
    server_name _;

    # PCs download installers, drivers, scripts and registry files from here.
    # This stays on HTTP: the PCs do not trust an internal certificate, and the
    # files are checksum-verified by Ansible on arrival.
    #
    # ANYONE who can reach this server on port 80 can download these files, and
    # they are not only installers: uploaded scripts and .reg files live here
    # too. Do not put secrets in a script. To limit it to your own PCs, list
    # their addresses here, e.g.
    #     allow 192.168.1.0/24;
    #     deny all;
    location /software/ {
        alias /var/lib/ansiweb/cache/;
        autoindex off;
        types { application/octet-stream exe msi cab dat zip ps1 cmd bat reg; }
        default_type application/octet-stream;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- port 443: the web interface ---------------------------------------------
server {
    listen 443 ssl default_server;
    # Add "listen [::]:443 ssl default_server;" if your network uses IPv6.
    # HTTP/2 needs nginx 1.25.1 or newer: add "http2 on;" there if available.
    server_name _;

    ssl_certificate     /etc/ssl/ansiweb/server.crt;
    ssl_certificate_key /etc/ssl/ansiweb/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    # Same cache path over HTTPS, for convenience when testing from a browser.
    location /software/ {
        alias /var/lib/ansiweb/cache/;
        autoindex off;
        default_type application/octet-stream;
    }

    # To restrict the dashboard to your admin network, uncomment and adjust:
    #   allow 192.168.1.0/24;
    #   deny all;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 7200;
        proxy_request_buffering off;
        client_max_body_size 4g;
    }
}
