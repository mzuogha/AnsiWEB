# AnsiWEB: serves the installer cache to PCs and proxies the web interface.
server {
    listen 80 default_server;
    # IPv6 is not enabled by default: PCs reach AnsiWEB over IPv4.
    # Add "listen [::]:80 default_server;" if your network uses IPv6.
    server_name _;

    # Installer cache used by the PCs (no directory listings)
    location /software/ {
        alias /var/lib/ansiweb/cache/;
        autoindex off;
        types { application/octet-stream exe msi cab dat; }
        default_type application/octet-stream;
    }

    # Web interface. To restrict it to your admin network, uncomment and adjust:
    #   allow 192.168.1.0/24;
    #   deny all;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200;
        proxy_request_buffering off;
        client_max_body_size 6g;
    }
}
